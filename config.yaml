      - {slug: veriff, name: "Veriff", domain: veriff.com}
      - {slug: pipedrive, name: "Pipedrive", domain: pipedrive.com}
      - {slug: wise, name: "Wise", domain: wise.com}
      - {slug: clio, name: "Clio", domain: clio.com}                    # Canada (Vancouver, Toronto)
      - {slug: wealthsimple, name: "Wealthsimple", domain: wealthsimple.com}  # Canada (Toronto)
  ashby:
    enabled: true
    companies:
      - {slug: n8n, name: "n8n", domain: n8n.io}
      - {slug: elevenlabs, name: "ElevenLabs", domain: elevenlabs.io}
      - {slug: supabase, name: "Supabase", domain: supabase.com}
      - {slug: posthog, name: "PostHog", domain: posthog.com}
      - {slug: deepl, name: "DeepL", domain: deepl.com}
      - {slug: pleo, name: "Pleo", domain: pleo.io}
      - {slug: synthesia, name: "Synthesia", domain: synthesia.io}
      - {slug: openai, name: "OpenAI", domain: openai.com}
      - {slug: langchain, name: "LangChain", domain: langchain.com}
      - {slug: parloa, name: "Parloa", domain: parloa.com}
      - {slug: helsing, name: "Helsing", domain: helsing.ai}
      - {slug: cohere, name: "Cohere", domain: cohere.com}              # Canada (Toronto)
      - {slug: 1password, name: "1Password", domain: 1password.com}     # Canada (Toronto)
  # LinkedIn / Indeed / Glassdoor via python-jobspy. Needs: pip install -e ".[linkedin]"
  jobspy:
    enabled: true
    sites: [linkedin, indeed]
    # Countries searched on LinkedIn/Indeed, one per line; put "# " in front of a line to skip that country.
    # Each country takes about 1-3 minutes, and LinkedIn may rate-limit you if you search many too often.
    # (LinkedIn only) = Indeed has no site for that country.
    countries:
      - DE   # Germany
      - CA   # Canada
      - IE   # Ireland
      - NL   # Netherlands
      - BE   # Belgium
      - LU   # Luxembourg
      - FR   # France
      - GB   # United Kingdom
      - SE   # Sweden
      - FI   # Finland
      - "NO" # Norway
      - PL   # Poland
      - DK   # Denmark
      - CZ   # Czechia
      - IS   # Iceland (LinkedIn only)
      - CH   # Switzerland
      - GR   # Greece (LinkedIn only)
      - MT   # Malta (LinkedIn only)
      - CY   # Cyprus (LinkedIn only)
      - IT   # Italy
      - PT   # Portugal
      - HU   # Hungary (LinkedIn only)
      - RO   # Romania (LinkedIn only)
    search_terms: ["python backend visa sponsorship", "senior python developer relocation"]
    results_per_search: 30
    hours_old: 336
    fetch_descriptions: true

# Cover letters (`jobfinder web` → Generate cover letter).
cover_letter:
  resume: resume/resume.html        # the facts letters are allowed to use
  candidate_name: Mohammad Ghaffary
  # Anything true that is not in the resume and should inform every letter, e.g. notice period or availability.
  extra_context: ""
  use_claude: true                  # needs ANTHROPIC_API_KEY; without it a template letter is used
  model: claude-opus-5-5
  effort: high

database: data/jobs.db
sponsors_dir: data/sponsors
output_dir: reports
