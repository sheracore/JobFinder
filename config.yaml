      - {slug: anthropic, name: "Anthropic", domain: anthropic.com}
      - {slug: mollie, name: "Mollie", domain: mollie.com}
      - {slug: adyen, name: "Adyen", domain: adyen.com}
      - {slug: wolt, name: "Wolt", domain: wolt.com}
