# JobFinder configuration, tuned for a senior Python backend engineer who needs visa sponsorship in Europe.

profile:
  # 4 points each (max 25 for skills together).
  primary_skills: [python, django, fastapi, kafka, kubernetes, microservices, postgresql, celery, rabbitmq, redis, docker]
  # 1 point each.
  secondary_skills: [django rest framework, drf, sqlalchemy, pydantic, clickhouse, mongodb, grafana, prometheus,
                     ci/cd, linux, event-driven, rest api, pytest, asyncio, distributed systems, n8n, blockchain, crypto,
                     fintech, payments]
  # A job is kept only if its title contains one of these.
  title_include: [backend, back-end, back end, python, django, fastapi, software engineer, software developer,
                  platform engineer, api engineer, developer, engineer]
  # ... and none of these.
  title_exclude: [junior, intern, internship, working student, werkstudent, praktikant, trainee, graduate, frontend,
                  front-end, ios, android, mobile, recruiter, sales, account executive, designer, marketing, support engineer,
                  qa, test engineer, data scientist, hardware, embedded, firmware, mechanical, electrical, php, ".net", "c#",
                  java developer, salesforce, sap]
  seniority_bonus: [senior, sr, lead, staff]

search:
  keywords: [python, backend, django]
  # Countries where you can get citizenship while keeping your Iranian citizenship, so you can hold two
  # passports. Weight between 0 and 1 (20 points × weight): higher = faster citizenship and a better job market.
  # Rules change; check the official site of each country before relying on these notes.
  countries:
    DE: 1.0    # Germany: dual citizenship allowed since 2024; citizenship after 5 years
    CA: 1.0    # Canada: dual allowed; citizenship after 3 of 5 years; Canadians can work in the US on a TN visa
    IE: 0.9    # Ireland: dual allowed; 5 years
    NL: 0.85   # Netherlands: normally must renounce, but Iranians are usually exempt because Iran does not
               #   allow renouncing. Confirm with the IND before relying on it.
    BE: 0.8    # Belgium: dual allowed; 5 years
    LU: 0.8    # Luxembourg: dual allowed; 5 years
    FR: 0.75   # France: dual allowed; 5 years
    GB: 0.75   # United Kingdom: dual allowed; about 6 years (a 10-year rule has been proposed)
    SE: 0.7    # Sweden: dual allowed; 8 years since June 2026
    FI: 0.7    # Finland: dual allowed; 8 years
    "NO": 0.7  # Norway: dual allowed since 2020; 8 years (quoted: YAML reads a bare NO as "false")
    PL: 0.65   # Poland: no renunciation required; about 8 years
    DK: 0.6    # Denmark: dual allowed since 2015; 9 years and strict tests
    CZ: 0.6    # Czechia: dual allowed since 2014; about 10 years
    IS: 0.55   # Iceland: dual allowed; 7 years
    CH: 0.55   # Switzerland: dual allowed; 10 years
    GR: 0.5    # Greece: dual allowed; 7 years
    MT: 0.5    # Malta: dual allowed
    CY: 0.5    # Cyprus: dual allowed
    IT: 0.5    # Italy: dual allowed; 10 years
    PT: 0.5    # Portugal: dual allowed; 10 years since May 2026
    HU: 0.45   # Hungary: dual allowed; Hungarian language test
    RO: 0.45   # Romania: dual allowed; 8 years, Romanian language test
    # Not listed because you would normally have to give up your Iranian citizenship (or the rules are
    # unclear): Austria, Estonia, Latvia, Lithuania, Spain, Slovakia, Slovenia, Croatia, Bulgaria, Serbia.
  other_europe_weight: 0.5
  only_listed_countries: true  # drop jobs that are only in countries not listed above
  include_remote_europe: false # remote jobs do not give you residence, so they do not lead to citizenship
  include_not_offered: false   # drop postings that say they do not sponsor
  require_visa_signal: false   # true = only keep jobs with a sponsorship, relocation or known-sponsor signal
  max_age_days: 45
  min_score: 35

sources:
  arbeitnow:
    enabled: true
    pages: 5
    only_visa: true     # Arbeitnow's own "visa sponsorship" filter
  remotive:
    enabled: true
    category: software-dev
  remoteok:
    enabled: true
  hackernews:
    enabled: true
    threads: 1          # latest monthly "Who is hiring?" thread
  # Company career pages. slug = the part of the board URL after the host, e.g. boards.greenhouse.io/<slug>.
  # name is shown in the app; domain is used for the company logo and link. A slug that does not exist (404)
  # is skipped with a warning, so it is safe to add guesses. A plain "slug" (no braces) also works.
  greenhouse:
    enabled: true
    companies:
      - {slug: n26, name: "N26", domain: n26.com}
      - {slug: sumup, name: "SumUp", domain: sumup.com}
      - {slug: hellofresh, name: "HelloFresh", domain: hellofresh.com}
      - {slug: getyourguide, name: "GetYourGuide", domain: getyourguide.com}
      - {slug: contentful, name: "Contentful", domain: contentful.com}
      - {slug: celonis, name: "Celonis", domain: celonis.com}
      - {slug: babbel, name: "Babbel", domain: babbel.com}
