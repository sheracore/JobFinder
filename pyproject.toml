[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobfinder"
version = "0.1.0"
description = "Find software jobs in Europe that offer visa sponsorship or relocation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mohammad Ghaffary" }]
dependencies = [
    "httpx>=0.27",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# LinkedIn, Indeed and Glassdoor have no public job APIs; JobSpy reads their public search pages.
linkedin = ["python-jobspy>=1.1.80"]
dev = ["pytest>=8"]

[project.scripts]
jobfinder = "jobfinder.cli:main"

[tool.setuptools.packages.find]
include = ["jobfinder*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
