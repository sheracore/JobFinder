<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Embers of the Hollow Crown</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Cpath d=%22M8 1 13 8 8 15 3 8z%22 fill=%22%23ff8a3d%22/%3E%3C/svg%3E">
<style>
  html, body { margin: 0; height: 100%; background: #05060a; overflow: hidden; }
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #wrap { position: relative; box-shadow: 0 0 60px rgba(0, 0, 0, 0.8); }
  #wrap canvas { position: absolute; left: 0; top: 0; display: block; }
  #world { image-rendering: pixelated; image-rendering: crisp-edges; }
  #fileWarn {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: #07080d; color: #d8d2c4; font: 16px/1.6 Georgia, serif; text-align: center; padding: 2em;
  }
  #fileWarn[hidden] { display: none; }
  #fileWarn code { background: #1b1f2c; color: #ffb070; padding: 2px 6px; border-radius: 3px; }
</style>
</head>
<body>
<div id="stage"><div id="wrap">
  <canvas id="world" width="480" height="270"></canvas>
  <canvas id="ui"></canvas>
</div></div>
<div id="fileWarn" hidden>
  <div>
    <p><strong>Embers of the Hollow Crown</strong> is built from ES modules, which browsers refuse to load from <code>file://</code>.</p>
    <p>From this folder, run <code>npx serve</code> or <code>python3 -m http.server</code>, then open the address it prints.</p>
  </div>
</div>
<script>
  if (location.protocol === 'file:') document.getElementById('fileWarn').hidden = false;
</script>
<script type="module" src="src/main.js"></script>
</body>
</html>
